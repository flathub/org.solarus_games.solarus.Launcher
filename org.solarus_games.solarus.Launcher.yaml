app-id: org.solarus_games.solarus.Launcher
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: solarus-run
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /lib/debug
  - /lib/pkgconfig
  - /share/glm
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json
  - shared-modules/lua5.1/lua-5.1.5.json
  - shared-modules/luajit/luajit.json
  - shared-modules/physfs/physfs.json

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
    - -DGLM_TEST_ENABLE=OFF
    - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
    - type: archive
      url: https://github.com/g-truc/glm/archive/refs/tags/1.0.3.tar.gz
      sha256: 6775e47231a446fd086d660ecc18bcd076531cfedd912fbd66e576b118607001

  - name: libmodplug
    cleanup:
      - /include
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/modplug-xmms/libmodplug/0.8.9.0/libmodplug-0.8.9.0.tar.gz
        sha256: 457ca5a6c179656d66c01505c0d95fafaead4329b9dbaa0f997d00a3508ad9de

  - name: solarus
    buildsystem: cmake-ninja
    config-opts:
      - -Wno-dev
      - -DCMAKE_BUILD_TYPE=Release
      - -DSOLARUS_TESTS=OFF
    builddir: true
    post-install:
      - install -Dm0644 ../solarus-launcher.appdata.xml ${FLATPAK_DEST}/share/appdata/org.solarus_games.solarus.Launcher.appdata.xml
      - install -Dm0644 ../icon.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/org.solarus_games.solarus.Launcher.png
    sources:
      - type: git
        url: https://gitlab.com/solarus-games/solarus.git
        tag: v2.0.3
        commit: d5e170be67a0119d73a502988e91bffcf04c3e06
      - type: file
        path: solarus-launcher.appdata.xml
      - type: file
        path: icon.png
