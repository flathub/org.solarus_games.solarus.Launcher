app-id: org.solarus_games.solarus.Launcher
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: solarus-launcher
rename-icon: org.solarus-games.solarus-launcher
rename-desktop-file: org.solarus-games.solarus-launcher.desktop
rename-appdata-file: org.solarus-games.solarus-launcher.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
cleanup:
  - /include
  - /lib/cmake
  - /share/man

modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json
  - shared-modules/luajit/luajit.json
  - shared-modules/physfs/physfs.json

  - name: libmodplug
    sources:
      - type: archive
        url: https://download.sourceforge.net/project/modplug-xmms/libmodplug/0.8.9.0/libmodplug-0.8.9.0.tar.gz
        sha512: 880e10154fd367ee24ace53ca7e32a5c1fee7dfff1f934e6499944c12779427da63e2f55f8d6ce25db0a42a5b4424053bf64305b31dbfc4ef6a8909924d655fd

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
    - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
    - type: git
      url: https://github.com/g-truc/glm.git
      tag: 1.0.3
      commit: 8d1fd52e5ab5590e2c81768ace50c72bae28f2ed

  - name: solarus
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSOLARUS_TESTS=OFF
    sources:
      - type: git
        url: https://gitlab.com/solarus-games/solarus.git
        tag: v2.1.0
        commit: 09d45b3c40ab08388eee29e285903e8e3b90a4cc

  - name: solarus-launcher
    buildsystem: cmake-ninja
    builddir: true
    subdir: launcher
    config-opts:
      - -DSOLARUS_QLEMENTINE_LOCAL_PATH=../../qlementine-1.4.2
      - -DSOLARUS_QLEMENTINE_ICONS_LOCAL_PATH=../../qlementine-icons-1.14.0
      - -DSOLARUS_QTAPPINSTANCEMANAGER_LOCAL_PATH=../../qtappinstancemanager-1.3.2
    sources:
      - type: git
        url: https://gitlab.com/solarus-games/solarus.git
        tag: v2.1.1
        commit: f411c58a467da28bcea030b420955a26878efb28
      - type: patch
        path: solarus-fetch-download.patch
      - type: patch
        path: appstream.patch
      - type: archive
        url: https://github.com/oclero/qlementine/archive/v1.4.2.tar.gz
        sha256: ed5196e6e04614db65f9a5f813eb35bf05076b7bce07892db33e85cf7b598616
        dest: qlementine-1.4.2
      - type: archive
        url: https://github.com/oclero/qlementine-icons/archive/v1.14.0.tar.gz
        sha256: d71cf8d471e26bf7a0b76d21e084c8727cff337972cd408124436b8a87c777e8
        dest: qlementine-icons-1.14.0
      - type: archive
        url: https://github.com/oclero/qtappinstancemanager/archive/v1.3.2.tar.gz
        sha256: d03eb60e4f0aefc30a75ca9bfb0d56674ab42e9a8c147ee3cf4a7cc802adf6f7
        dest: qtappinstancemanager-1.3.2
